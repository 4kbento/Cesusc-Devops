name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Enviar arquivos para a EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          rsync -az --exclude '.git' -e "ssh -i ~/.ssh/deploy.pem -o StrictHostKeyChecking=no" ./ ubuntu@$SERVER_IP:/opt/cesusc-devops/
