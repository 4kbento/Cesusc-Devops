name: CI

on:
  push:
    branches: [ "Develop" ]
  workflow_dispatch:

jobs:
  # Integracao continua: instala dependencias e roda os testes
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Jest
        run: npm test -- --passWithNoTests

  # Entrega continua: so roda se o build passar e faz o merge da Develop na main
  delivery:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Merge da Develop na main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge --no-ff origin/Develop -m "Merge Develop into main"
          git push origin main
